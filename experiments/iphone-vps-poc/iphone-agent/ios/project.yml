name: iPhoneAgent
options:
  bundleIdPrefix: com.karkandea
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
targets:
  iPhoneAgent:
    type: application
    platform: iOS
    sources:
      - iPhoneAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karkandea.iphoneagent
        DEVELOPMENT_TEAM: T32AUN4M4L
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
    info:
      path: iPhoneAgent/Info.plist
      properties:
        CFBundleDisplayName: iPhone Agent
        UILaunchScreen: {}
        AgentAPIBaseURL: https://mcp.dualangka.com/iphone-agent
    entitlements:
      path: iPhoneAgent/iPhoneAgent.entitlements
      properties:
        aps-environment: development
